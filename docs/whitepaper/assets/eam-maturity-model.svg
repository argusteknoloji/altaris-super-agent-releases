<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="500" fill="#0a0908"/>

  <!-- Corner label -->
  <text x="48" y="52" font-size="14" letter-spacing="4" fill="#f08c50">EAM MATURITY MODEL</text>
  <line x1="48" y1="66" x2="276" y2="66" stroke="#d97757" stroke-width="1" opacity="0.5"/>

  <!-- Ascending progress line behind steps -->
  <line x1="80" y1="404" x2="1096" y2="120" stroke="#f08c50" stroke-width="1" opacity="0.25" stroke-dasharray="4 6"/>

  <!-- Arrow head on progress line -->
  <polygon points="1108,116 1088,114 1094,132" fill="#f08c50" opacity="0.7"/>

  <!-- ===== L1 Ad-hoc ===== -->
  <g>
    <rect x="48" y="356" width="200" height="92" fill="none" stroke="#d97757" stroke-width="1.2"/>
    <rect x="48" y="356" width="200" height="92" fill="#d97757" opacity="0.05"/>
    <text x="64" y="386" font-size="16" fill="#f08c50">L1</text>
    <text x="96" y="386" font-size="16" fill="#ddd8d0">Ad-hoc</text>
    <text x="64" y="412" font-size="11" fill="#8a8378">Individual subscriptions,</text>
    <text x="64" y="428" font-size="11" fill="#8a8378">no visibility</text>
  </g>

  <!-- ===== L2 Pilot ===== -->
  <g>
    <rect x="276" y="296" width="200" height="92" fill="none" stroke="#d97757" stroke-width="1.2"/>
    <rect x="276" y="296" width="200" height="92" fill="#d97757" opacity="0.07"/>
    <text x="292" y="326" font-size="16" fill="#f08c50">L2</text>
    <text x="324" y="326" font-size="16" fill="#ddd8d0">Pilot</text>
    <text x="292" y="352" font-size="11" fill="#8a8378">Isolated team</text>
    <text x="292" y="368" font-size="11" fill="#8a8378">experiments</text>
  </g>

  <!-- ===== L3 Managed ===== -->
  <g>
    <rect x="504" y="236" width="200" height="92" fill="none" stroke="#d97757" stroke-width="1.2"/>
    <rect x="504" y="236" width="200" height="92" fill="#d97757" opacity="0.09"/>
    <text x="520" y="266" font-size="16" fill="#f08c50">L3</text>
    <text x="552" y="266" font-size="16" fill="#ddd8d0">Managed</text>
    <text x="520" y="292" font-size="11" fill="#8a8378">Central access &amp;</text>
    <text x="520" y="308" font-size="11" fill="#8a8378">cost visibility</text>
  </g>

  <!-- ===== L4 Orchestrated ===== -->
  <g>
    <rect x="732" y="176" width="200" height="92" fill="none" stroke="#d97757" stroke-width="1.2"/>
    <rect x="732" y="176" width="200" height="92" fill="#d97757" opacity="0.11"/>
    <text x="748" y="206" font-size="16" fill="#f08c50">L4</text>
    <text x="780" y="206" font-size="16" fill="#ddd8d0">Orchestrated</text>
    <text x="748" y="232" font-size="11" fill="#8a8378">Multi-agent workflows,</text>
    <text x="748" y="248" font-size="11" fill="#8a8378">integrated governance</text>
  </g>

  <!-- ===== L5 Autonomous ===== -->
  <g>
    <rect x="960" y="116" width="200" height="92" fill="none" stroke="#f08c50" stroke-width="1.6"/>
    <rect x="960" y="116" width="200" height="92" fill="#f08c50" opacity="0.12"/>
    <text x="976" y="146" font-size="16" fill="#f08c50">L5</text>
    <text x="1008" y="146" font-size="16" fill="#ddd8d0">Autonomous</text>
    <text x="976" y="172" font-size="11" fill="#8a8378">Autonomous processes,</text>
    <text x="976" y="188" font-size="11" fill="#8a8378">human-on-exception</text>
  </g>

  <!-- Step risers (staircase edges) -->
  <line x1="248" y1="402" x2="276" y2="402" stroke="#8a8378" stroke-width="1" opacity="0.5"/>
  <line x1="476" y1="342" x2="504" y2="342" stroke="#8a8378" stroke-width="1" opacity="0.5"/>
  <line x1="704" y1="282" x2="732" y2="282" stroke="#8a8378" stroke-width="1" opacity="0.5"/>
  <line x1="932" y1="222" x2="960" y2="222" stroke="#8a8378" stroke-width="1" opacity="0.5"/>

  <!-- Baseline -->
  <line x1="48" y1="470" x2="1152" y2="470" stroke="#8a8378" stroke-width="1" opacity="0.35"/>
  <text x="48" y="492" font-size="12" letter-spacing="2" fill="#8a8378">EAM &#8212; ENTERPRISE AI MANAGEMENT &#183; FIVE-LEVEL MATURITY LADDER</text>
  <text x="1152" y="492" font-size="12" letter-spacing="2" fill="#8a8378" text-anchor="end">ARGUS &#183; ALTARIS</text>
</svg>
